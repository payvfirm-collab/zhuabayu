<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>爪巴鱼</title>
  <meta name="description" content="zhuabayu">
  <style>
    :root{color-scheme:light dark;--page:#fff}
    @media (prefers-color-scheme:dark){:root{--page:#0b0b0d}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--page)}
    body{
      min-height:100svh;
      display:grid;
      place-items:center;
      overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    }
    .stage{
      width:100vw;
      aspect-ratio:16/6;
      position:relative;
      overflow:hidden;
      background:#d9d9dd;
      isolation:isolate;
    }
    .wallpaper{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
      opacity:.90;user-select:none;-webkit-user-drag:none;
    }
    .wash{position:absolute;inset:0;z-index:1;background:rgba(255,255,255,.035);pointer-events:none}
    @media (prefers-color-scheme:dark){.wash{background:rgba(0,0,0,.065)}}
    .copy{position:absolute;inset:0;z-index:2;text-align:center;pointer-events:none}
    h1{
      position:absolute;
      left:50%;top:50%;
      transform:translate(-50%,-50%);
      margin:0;
      font-size:clamp(72px,11.7vw,194px);
      line-height:.82;
      font-weight:600;
      letter-spacing:-.067em;
      color:#fff;
      text-shadow:0 3px 30px rgba(0,0,0,.20);
      white-space:nowrap;
    }
    .tip-wrap{
      position:absolute;
      left:50%;
      top:calc(50% + clamp(74px,8.7vw,138px));
      transform:translateX(-50%);
      width:min(84vw,1180px);
      min-height:2.6em;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }
    .tip{
      margin:0;
      max-width:100%;
      font-size:clamp(8px,.66vw,11px);
      line-height:1.75;
      font-weight:300;
      letter-spacing:.105em;
      color:rgba(255,255,255,.86);
      text-shadow:0 1px 10px rgba(0,0,0,.25);
      text-wrap:balance;
      transition:opacity .45s ease,transform .45s ease;
    }
    .tip.out{opacity:0;transform:translateY(4px)}
    @media (max-width:700px){
      h1{font-size:clamp(44px,14vw,92px)}
      .tip-wrap{top:calc(50% + clamp(42px,12vw,72px));width:88vw}
      .tip{font-size:7px;line-height:1.65;letter-spacing:.075em}
    }
    @media (prefers-reduced-motion:reduce){.tip{transition:none}}
  </style>
</head>
<body>
  <main class="stage" aria-label="zhuabayu">
    <img class="wallpaper" src="https://bing.biturl.top/?resolution=1920&format=image&index=0&mkt=zh-CN" alt="" referrerpolicy="no-referrer">
    <div class="wash"></div>
    <section class="copy">
      <h1>爪巴鱼</h1>
      <div class="tip-wrap"><p class="tip" id="tip">我们把一切都安排得井井有条。至少从首页看起来是这样。</p></div>
    </section>
  </main>
  <script>
    const tips = [
      "我们把一切都安排得井井有条。至少从首页看起来是这样。",
      "从域名到服务器，每一层都经过认真设计。也经过几次临时起意。",
      "我们的基础设施足够灵活，可以在半夜因为一个新想法重新长一遍。",
      "有些功能来自长期规划。有些功能来自一句‘要不顺手加上这个’。",
      "我们重新定义了稳定：如果今天没有 502，那它今天就是稳定的。",
      "自动化每天准时开始工作。人类是否准时，不属于系统承诺的一部分。",
      "每一个看似简单的入口背后，都可能连接着三个服务和一个忘记写文档的脚本。",
      "我们相信无缝体验。所以很多接缝都被放在了你看不见的地方。",
      "服务器会记得该做什么。至于我们为什么让它这么做，偶尔需要想一会儿。",
      "这里的很多东西都不是计划的一部分。后来，它们成了计划最重要的一部分。",
      "一个域名可以承载很多东西。项目、实验、临时页面，还有下一次突然冒出来的主意。",
      "我们让系统尽可能自动运行，然后把省下来的时间用来继续改系统。",
      "从一个按钮到另一个按钮，中间可能经过了比想象中更多的基础设施。",
      "有些服务负责工作，有些服务负责记住工作，还有一些服务负责记住我们为什么要工作。",
      "我们把复杂留在幕后。幕后目前稍微有一点拥挤。",
      "如果你觉得这里很安静，那是因为报错信息没有被放到首页。",
      "这里没有庞大的技术团队。好消息是，也没有人需要参加晨会。",
      "每一次顺利加载，都代表若干个不太顺利的凌晨已经被成功隐藏。",
      "我们喜欢把重复的事情交给自动化，再为自动化写更多需要自动化的事情。",
      "有时候，工程的最后一步不是完成，而是决定今天先不动它。",
      "新的功能通常从一句很轻松的话开始，然后逐渐拥有自己的配置文件。",
      "我们没有刻意追求复杂。复杂通常自己就会来。",
      "如果一个东西能跑，我们会先让它跑起来，再认真研究它为什么能跑。",
      "有些配置只有一行。有些一行配置背后有四小时的故事。",
      "我们让不同的系统彼此协作，也让它们偶尔彼此吓一跳。",
      "一个页面负责展示结果。至于结果是怎么来的，最好留一点神秘感。",
      "这里的生产环境和实验环境关系很好。有时候好到很难分辨。",
      "工具越来越多，入口越来越少。这听起来像进步，所以我们决定相信它。",
      "我们的技术路线很明确：先有一个能用的版本，然后再拥有很多能用的版本。",
      "我们不追求每件事都一次成功。我们更擅长让第二次看起来像第一次就成功了。",
      "有些功能被正式上线。有些功能只是一直没有被下线。",
      "当一个临时方案存在得足够久，它就会获得一个正式名字。",
      "所有重要数据都有自己的去处。偶尔，我们也需要重新确认那个去处在哪里。",
      "我们相信持续改进，也相信有些东西睡一觉以后会自己恢复。",
      "这里的大部分系统都有日志。理解日志是另一个独立系统。",
      "我们把能自动的都自动了。剩下不能自动的，正在等待下一次半夜灵感。",
      "如果你看到一个非常自然的结果，它背后大概有一段非常不自然的过程。",
      "每一个不起眼的小功能，都有机会发展成一个需要单独维护的小生态。",
      "我们重新思考了‘临时’这个词，并决定暂时不为它设置截止日期。",
      "这里的很多决定都经过充分讨论。讨论参与者通常不超过一个人和几个模型。",
      "我们努力减少不必要的步骤。然后为了减少步骤，新增了一套自动化。",
      "从微信到工具，从工具到记忆，从记忆到下一次对话，一切都显得非常顺理成章。",
      "系统会在合适的时间记住重要的事。偶尔，也会记住一些很有个性的细节。",
      "有些项目有路线图。有些项目的路线图就是聊天记录。",
      "我们没有办公室政治。只有偶尔争夺默认模型的技术分歧。",
      "每个服务都有自己的职责。直到某天它顺便接手了另外三个职责。",
      "这里的一切都可以继续扩展。这个事实本身既令人安心，也令人担心。",
      "我们很少说‘最终版’。这样每一次修改都不会显得背叛承诺。",
      "一个看起来很正式的域名，完全可以承载一些并不那么正式的事情。",
      "如果今天一切正常，请享受结果。至于明天，我们有自动重启。",
      "我们把草台藏在了精致的排版后面。现在，它看起来已经相当专业。",
      "我们没有改变任何重要的东西。只是让它们看起来终于像自己。",
      "有些体验不需要被解释。解释本身也不在计划里。",
      "今天和昨天几乎一样。区别发生在你没有注意到的地方。",
      "我们保留了必要的复杂，也保留了不必要的自信。",
      "真正值得保留的东西，通常不会主动提醒你它一直都在。",
      "这不是下一步。只是原来的那一步，终于走到了这里。",
      "当所有东西都开始各司其职，偶尔也会有人想不起自己的职责。",
      "我们减少了你能看到的东西，同时增加了你看不到的东西。",
      "每一次看起来毫无变化的刷新，都可能代表后台做了很多无关紧要的努力。",
      "有些答案没有被写下来，因为当时大家都觉得自己会记得。",
      "系统正在按设计运行。至于设计是什么，我们保持开放。",
      "不是所有细节都需要被发现。有些细节只需要存在。",
      "欢迎来到 zhuabayu。前台很安静，后台一直很有想法。"
    ];
    const tip=document.getElementById('tip');
    let last=-1;
    function nextTip(){
      let i;
      do{i=Math.floor(Math.random()*tips.length)}while(i===last&&tips.length>1);
      tip.classList.add('out');
      setTimeout(()=>{tip.textContent=tips[i];last=i;tip.classList.remove('out')},430);
    }
    setInterval(nextTip,5600);
  </script>
</body>
</html>
